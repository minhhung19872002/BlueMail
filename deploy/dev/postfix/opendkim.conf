Socket                  inet:8891@127.0.0.1
Domain                  doitac.test
Selector                dt2026
KeyFile                 /etc/opendkim/keys/doitac.test.private.pem
Canonicalization        relaxed/relaxed
OversignHeaders         From
AuthservID              mail.doitac.test
AlwaysAddARHeader       no
InternalHosts           127.0.0.1,10.77.0.40
Nameservers             10.77.0.53
UserID                  opendkim
PidFile                 /run/opendkim/opendkim.pid
