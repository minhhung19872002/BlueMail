# Builds the two BlueMail images on GitHub-hosted runners and pushes them to GHCR, so a server only pulls them
# (building .NET on a small shared server exhausted its memory, docs/04 "Shared server"). No deployment here.
name: images

on:
  push:
    branches: [main]
    paths: ["src/**", "web/**", "deploy/docker/**", "Directory.*", "*.slnx", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            dockerfile: deploy/docker/server.Dockerfile
          - name: web
            dockerfile: deploy/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/minhhung19872002/bluemail-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/minhhung19872002/bluemail-${{ matrix.name }}:main
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
